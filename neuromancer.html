<!DOCTYPE html>
<html>
<head>
    <style>
        HTML {
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100%;
        }
        .container {
            display: block;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50%;
        }

        /* Basic styling for the countdown */
        #countdown-container {
            font-family: Arial, sans-serif;
            font-size: 24px;
            text-align: center;
            padding: 20px;
        }
        .time-unit {
            display: inline-block;
            margin: 0 10px;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="image-container">
        <img src="./images/nm-logo.webp" />
    </div>
    <div id="countdown-container">
        <div class="time-unit">Days: <span id="days">00</span></div>
        <div class="time-unit">Hours: <span id="hours">00</span></div>
        <div class="time-unit">Minutes: <span id="minutes">00</span></div>
        <div class="time-unit">Seconds: <span id="seconds">00</span></div>
    </div>
</div>

<script>
    // 1. Set the target date and time
    // Format: "Month Day, Year Hour:Minute:Second"
    var countDownDate = new Date("Jan 22, 2027 00:00:00").getTime();

    // 2. Update the countdown every 1 second
    var x = setInterval(function() {

        // Get today's date and time
        var now = new Date().getTime();

        // Find the distance between now and the count down date
        var distance = countDownDate - now;

        // Time calculations for days, hours, minutes and seconds
        var days = Math.floor(distance / (1000 * 60 * 60 * 24));
        var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        var seconds = Math.floor((distance % (1000 * 60)) / 1000);

        // Display the result in the HTML elements
        document.getElementById("days").innerHTML = days;
        document.getElementById("hours").innerHTML = hours;
        document.getElementById("minutes").innerHTML = minutes;
        document.getElementById("seconds").innerHTML = seconds;

        // If the count down is finished, write some text
        if (distance < 0) {
            clearInterval(x);
            document.getElementById("countdown-container").innerHTML = "NEUROMANCER IS HERE!";
        }
    }, 1000);
</script>

</body>
</html>
